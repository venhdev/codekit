name: codekit_qa_app
description: Native Android/iOS QA application for CodeKit integrations.
publish_to: none
resolution: workspace
version: 1.0.0+1

environment:
  sdk: '>=3.13.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  codekit: ^0.1.0
  codekit_core: ^0.1.0
  codekit_console: ^0.1.0
  codekit_dio: ^0.1.0
  codekit_drift_diagnostic_store: ^0.1.0
  codekit_flutter: ^0.1.0
  codekit_http: ^0.1.0
  codekit_ui: ^0.1.0
  codekit_webhook: ^0.1.0
  colored_logger: ^2.2.0
  dio: ^5.11.1
  http: ^1.6.0
  path: ^1.9.1
  path_provider: ^2.1.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
